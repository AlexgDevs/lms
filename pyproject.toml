[project]
name = "lms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
packages = [{ include = "src" }]
dependencies = [
    "aioboto3>=15.5.0",
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "celery>=5.5.3",
    "fastapi>=0.137.1",
    "httpx>=0.28.1",
    "openai>=1.55.0",
    "loguru>=0.7.3",
    "nh3>=0.3.3",
    "mypy>=2.1.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "python-multipart>=0.0.32",
    "redis[asyncio]>=8.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
    "celery-types>=0.26.0",
]

[tool.mypy]
strict = true
show_error_codes = true
explicit_package_bases = true
exclude = [".venv"]

[[tool.mypy.overrides]]
module = ["aioboto3", "botocore", "botocore.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*", "openai", "openai.*"]
ignore_missing_imports = true
