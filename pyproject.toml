[project]
name = "lms"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
packages = [{ include = "src" }]
dependencies = [
    "alembic>=1.18.4",
    "asyncpg>=0.31.0",
    "black>=26.5.1",
    "fastapi>=0.137.1",
    "loguru>=0.7.3",
    "mypy>=2.1.0",
    "pwdlib[argon2]>=0.3.0",
    "pydantic-settings>=2.14.1",
    "pydantic[email]>=2.13.4",
    "pyjwt>=2.13.0",
    "redis[asyncio]>=8.0.0",
    "sqlalchemy>=2.0.51",
    "uvicorn>=0.49.0",
]

[tool.mypy]
strict = true
show_error_codes = true
explicit_package_bases = true
exclude = [".venv"]
