# TEMPORARY — HTTP-only nginx used only to obtain the first Let's Encrypt cert
# via webroot. Once the cert exists, switch to deploy/nginx.conf (which serves :443).
# Never keeps this file permanently in production.
upstream backend_upstream {
    server backend:8000;
    server backend-1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name plectix.ru www.plectix.ru;

    # ACME challenge webroot (mounted host dir) — must be reachable by certbot.
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    root /usr/share/nginx/html;
    index index.html;

    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    location /media/ {
        rewrite ^/media/(.*)$ /lms-media/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
