# ACME (Let's Encrypt) challenge + HTTP→HTTPS redirect on :80, app on :443.
# Certificates are obtained on the host via certbot (webroot) into ./certbot/conf,
# mounted into this container at /etc/letsencrypt.
upstream backend_upstream {
    server backend:8000;
    server backend-1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name plectix.ru www.plectix.ru;

    # Serve the ACME challenge files from the mounted webroot (for certbot).
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name plectix.ru www.plectix.ru;

    ssl_certificate     /etc/letsencrypt/live/plectix.ru/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/plectix.ru/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    root /usr/share/nginx/html;
    index index.html;

    # Backend API
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
    }

    # WebSocket (notification push)
    location /ws/ {
        proxy_pass http://backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 3600s;
    }

    # Public media served from MinIO bucket (public-read)
    # Private block media uses presigned URLs (variant B): S3Storage rewrites
    # ``http://minio:9000/<bucket>/<key>?sig`` → ``<public_base>/<key>?sig``
    # so the browser hits ``/media/<key>?sig``. Rewrite back to ``/<bucket>/``
    # restores the canonical URI; forwarding with ``Host: minio:9000``
    # (``$proxy_host``) keeps the SigV4 ``host`` header valid.
    location /media/ {
        rewrite ^/media/(.*)$ /lms-media/$1 break;
        proxy_pass http://minio:9000;
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}
