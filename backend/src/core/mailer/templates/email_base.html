<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>$heading</title>
</head>
<body style="margin:0;padding:0;background-color:#F8F9FA;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#F8F9FA;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="600" cellpadding="0" cellspacing="0" style="max-width:600px;width:100%;background-color:#FFFFFF;border:1px solid #E4E7EC;border-radius:16px;">
        <tr>
          <td style="padding:32px 32px 0;text-align:center;">
            <a href="$home_url" style="text-decoration:none;">
              <img src="$logo_url" alt="PLECTIX" width="200" style="display:block;margin:0 auto;width:200px;height:auto;border:0;outline:none;">
            </a>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px 0;">
            <h1 style="margin:0 0 12px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:22px;line-height:1.3;font-weight:700;color:#111827;">$heading</h1>
            <p style="margin:0 0 24px;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;line-height:1.6;color:#4B5563;">$intro</p>
          </td>
        </tr>
        <tr>
          <td style="padding:0 32px 8px;text-align:center;">
            <a href="$button_url" style="display:inline-block;padding:14px 32px;background-color:#0E7490;color:#FFFFFF;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:15px;font-weight:600;line-height:1.4;border-radius:10px;text-decoration:none;">$button_text</a>
            <p style="margin:20px 0 0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.5;color:#6B7280;">
              Если кнопка не открывается, скопируйте ссылку:
              <br>
              <a href="$button_url" style="color:#0891B2;word-break:break-all;">$button_url</a>
            </p>
          </td>
        </tr>
        <tr>
          <td style="padding:8px 32px 0;">
            <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:13px;line-height:1.6;color:#6B7280;">$note</p>
          </td>
        </tr>
        <tr>
          <td style="padding:24px 32px;border-top:1px solid #E4E7EC;">
            <p style="margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;font-size:12px;line-height:1.6;color:#6B7280;">
              $brand — платформа онлайн-обучения.
              <br>
              Это автоматическое письмо, пожалуйста, не отвечайте на него.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
