# Production stack. Run from a server with Docker, using prebuilt ghcr images.
#   docker compose -f docker-compose.prod.yml --env-file .env.prod pull backend backend-1 worker nginx migrate
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d
# Rolling deploy: deploy/roll.sh (recreate backend-1, then backend — no downtime).
# Provide the real secrets in .env.prod (from .env.prod.example; never commit).
name: plm

services:
  postgres:
    image: postgres:18-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks: [app_network]

  redis:
    image: redis:7.2-alpine
    restart: unless-stopped
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
    environment:
      REDIS_USER: ${REDIS_USER:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "--user", "${REDIS_USER:-default}", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks: [app_network]

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    networks: [app_network]

  minio-init:
    image: minio/mc:latest
    restart: "no"
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
      STORAGE_BUCKET: ${STORAGE_BUCKET:-lms-media}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 $$MINIO_ROOT_USER $$MINIO_ROOT_PASSWORD &&
      mc mb --ignore-existing local/$$STORAGE_BUCKET &&
      mc anonymous set download local/$$STORAGE_BUCKET &&
      echo 'MinIO bucket ready: '$$STORAGE_BUCKET
      "
    networks: [app_network]

  # One-shot: apply DB migrations before the app starts.
  migrate:
    image: ghcr.io/${REGISTRY_NS}/backend:${IMAGE_TAG}
    restart: "no"
    command: ["uv", "run", "alembic", "upgrade", "head"]
    env_file: .env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks: [app_network]

  # Shared environment + dependencies for the app replicas (blue-green).
  backend-1:
    image: ghcr.io/${REGISTRY_NS}/backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_PUBLIC_BASE_URL: ${PUBLIC_URL}/media
      CODEEXEC_BASE_URL: http://piston:2000
      FRONTEND_HOST: ${PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/hello')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app_network]

  backend:
    image: ghcr.io/${REGISTRY_NS}/backend:${IMAGE_TAG}
    restart: unless-stopped
    env_file: .env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      STORAGE_ENDPOINT_URL: http://minio:9000
      STORAGE_PUBLIC_BASE_URL: ${PUBLIC_URL}/media
      CODEEXEC_BASE_URL: http://piston:2000
      FRONTEND_HOST: ${PUBLIC_URL}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/hello')"]
      interval: 30s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [app_network]

  worker:
    image: ghcr.io/${REGISTRY_NS}/backend:${IMAGE_TAG}
    restart: unless-stopped
    command: ["uv", "run", "celery", "-A", "src.core.celery_app", "worker", "--loglevel=info"]
    env_file: .env.prod
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_USER: ${REDIS_USER:-default}
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      CODEEXEC_BASE_URL: http://piston:2000
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks: [app_network]

  # Code execution — heavy image; requires cgroup v2 on the Docker host.
  piston:
    image: ghcr.io/engineer-man/piston:latest
    restart: unless-stopped
    profiles: ["codeexec"]
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      PISTON_PORT: 2000
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    networks: [app_network]

  nginx:
    image: ghcr.io/${REGISTRY_NS}/frontend:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      # Override the baked-in nginx config with the host copy (no CI rebuild needed).
      - ./deploy/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      # Let's Encrypt certs (obtained on the host via certbot webroot).
      - ./certbot/conf:/etc/letsencrypt
      - ./certbot/www:/var/www/certbot
    depends_on:
      backend:
        condition: service_started
      backend-1:
        condition: service_started
    networks: [app_network]

volumes:
  postgres_data:
  redis_data:
  minio_data:

networks:
  app_network:
    driver: bridge
